<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>REL Weight Recorder</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0)}
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
#hdr{background:#1e40af;color:#fff;padding:14px 16px;position:-webkit-sticky;position:sticky;top:0;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#hdr h1{font-size:18px;font-weight:700}
#hdr p{font-size:12px;opacity:.85;margin-top:2px}
.scr{display:none;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.lbl{display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rbtn{padding:16px 8px;border:3px solid #e2e8f0;border-radius:12px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;color:#334155;-webkit-appearance:none;width:100%;font-family:inherit;line-height:1.3;touch-action:manipulation}
.rbtn small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:4px}
select,input[type=text]{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;background:#fff;-webkit-appearance:none;color:#0f172a;font-family:inherit}
input.wnum{font-size:28px;font-weight:700;text-align:center}
input:focus,select:focus{outline:none;border-color:#1d4ed8}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;margin-bottom:10px;-webkit-appearance:none;font-family:inherit;touch-action:manipulation}
.btn-blue{background:#1d4ed8;color:#fff}
.btn-gray{background:#e2e8f0;color:#475569}
.btn-red{background:#dc2626;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.rtop{background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;gap:10px}
.rtop h2{font-size:15px;font-weight:700}.rtop p{font-size:11px;color:#64748b;margin-top:2px}
.prog{border:2px solid #1d4ed8;color:#1d4ed8;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
.tabs{display:flex;background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:3px solid transparent;touch-action:manipulation}
.tab.on{color:#1d4ed8;border-bottom-color:#1d4ed8}
.pb{display:inline-block;background:#ef4444;color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:3px;font-weight:700}
.srch{margin-bottom:10px}
.scard{background:#fff;border-radius:12px;padding:14px 15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:2px solid #e2e8f0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.scard:active{opacity:.7}
.scard.done{border-color:#16a34a;background:#f0fdf4}
.scard.part{border-color:#f59e0b;background:#fffbeb}
.sr1{display:flex;align-items:flex-start;gap:10px}
.snum{width:32px;height:32px;min-width:32px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.snum.done{background:#16a34a;color:#fff}
.smain{flex:1;min-width:0}
.sname{font-size:14px;font-weight:600;line-height:1.4;word-break:break-word}
.saddr{font-size:11px;color:#64748b;margin-top:3px;line-height:1.4;word-break:break-word}
.sbins{font-size:11px;color:#94a3b8;margin-top:3px}
.swts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wb{font-size:12px;padding:4px 10px;border-radius:6px;font-weight:600}
.wb-in{background:#dbeafe;color:#1e40af}
.wb-out{background:#dcfce7;color:#166534}
.wb-nil{background:#fee2e2;color:#991b1b}
.wb-t{background:#f1f5f9;color:#64748b;font-weight:400;font-size:11px}
.empty{text-align:center;padding:60px 20px;color:#94a3b8}.empty p{font-size:15px}
.spc{height:90px}
.fab{position:fixed;bottom:24px;right:16px;background:#1d4ed8;color:#fff;border:none;border-radius:30px;padding:15px 22px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer;z-index:50;-webkit-appearance:none;font-family:inherit;touch-action:manipulation}
#wOv{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200}
.mwrap{position:absolute;bottom:0;left:0;right:0}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:24px 16px 50px}
.mbar{width:44px;height:5px;background:#e2e8f0;border-radius:3px;margin:0 auto 20px}
.modal h3{font-size:16px;font-weight:700;line-height:1.4}
.maddr{font-size:12px;color:#64748b;margin-top:5px;line-height:1.4}
.mbins{display:inline-block;background:#f1f5f9;color:#334155;font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;margin:12px 0 18px}
.wrow{display:flex;gap:14px;margin-bottom:10px}
.wf{flex:1}
.wf label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:8px}
.wunit{text-align:center;font-size:12px;color:#94a3b8;margin-top:6px}
.mbtns{display:flex;gap:12px;margin-top:20px}
.mbtns .btn{flex:1;margin-bottom:0}
.mnote{font-size:12px;color:#94a3b8;text-align:center;margin-top:12px}
.ecard{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ecard h3{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.erow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.erow:last-child{border:none}
.ev{font-weight:700}.eg{color:#16a34a}.er{color:#dc2626}
textarea{width:100%;height:200px;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:11px;font-family:monospace;resize:none;line-height:1.5;-webkit-appearance:none;color:#0f172a;background:#fff}</style>
</head>
<body>

<div id="hdr"><h1 id="h1">REL Weight Recorder</h1><p id="h2">Select a route to start</p></div>

<div id="sSetup" class="scr">
  <div class="card">
    <span class="lbl">Tap a Route to Select</span>
    <div class="rgrid">
<button type="button" class="rbtn" id="rb-Day-Route" data-route="Day Route" data-color="#1d4ed8">Day Route<small>72 stops</small></button>
<button type="button" class="rbtn" id="rb-Night-Route" data-route="Night Route" data-color="#6d28d9">Night Route<small>73 stops</small></button>
<button type="button" class="rbtn" id="rb-6th-Route" data-route="6th Route" data-color="#065f46">6th Route<small>46 stops</small></button>
<button type="button" class="rbtn" id="rb-DTL-Route" data-route="DTL Route" data-color="#b45309">DTL Route<small>57 stops</small></button>
<button type="button" class="rbtn" id="rb-Mandai-Route" data-route="Mandai Route" data-color="#be123c">Mandai Route<small>64 stops</small></button>
<button type="button" class="rbtn" id="rb-Tekong-Route" data-route="Tekong Route" data-color="#0e7490">Tekong Route<small>23 stops</small></button>
    </div>
  </div>
  <div class="card">
    <label class="lbl" for="iDriver">Driver Name</label>
    <input type="text" id="iDriver" placeholder="Enter your name" autocomplete="name" autocorrect="off" autocapitalize="words">
  </div>
  <div class="card">
    <label class="lbl" for="iVeh">Vehicle Number</label>
    <select id="iVeh">
      <option value="">-- Select Vehicle --</option>
      <option>XF622P</option><option>XE1052H</option><option>XE1839E</option>
      <option>XE6675C</option><option>XE8337R</option><option>XF588F</option>
    </select>
  </div>
  <button type="button" id="btnStart" class="btn btn-blue">Start Recording</button>
</div>

<div id="sRoute" class="scr">
  <div class="rtop">
    <div><h2 id="rName">-</h2><p id="rInfo">-</p></div>
    <div class="prog" id="rProg">0/0</div>
  </div>
  <div class="tabs">
    <div class="tab on" data-f="all">All</div>
    <div class="tab" data-f="pend">Pending <span class="pb" id="pbN">0</span></div>
    <div class="tab" data-f="done">Done</div>
  </div>
  <div class="srch"><input type="text" id="iSrch" placeholder="Search customer..." autocorrect="off" autocapitalize="off"></div>
  <div id="stopList"></div>
  <div class="spc"></div>
  <button type="button" id="fabBtn" class="fab">Export / Summary</button>
</div>

<div id="sExport" class="scr">
  <div class="ecard" id="eSumm"></div>
  <div class="ecard">
    <h3>Copy Data</h3>
    <textarea id="eTxt" readonly></textarea>
    <button type="button" id="btnCopy" class="btn btn-blue" style="margin-top:10px">Copy to Clipboard</button>
  </div>
  <button type="button" id="btnBack" class="btn btn-gray">Back to Route</button>
  <button type="button" id="btnEnd" class="btn btn-red">End Session</button>
</div>

<div id="wOv">
  <div class="mwrap"><div class="modal">
    <div class="mbar"></div>
    <h3 id="mTitle">-</h3>
    <p class="maddr" id="mAddr"></p>
    <div class="mbins" id="mBins"></div>
    <div class="wrow">
      <div class="wf">
        <label for="wIn">Weight IN (t)</label>
        <input type="text" id="wIn" class="wnum" placeholder="0.00" inputmode="decimal" pattern="[0-9.]*">
        <div class="wunit">tonnes</div>
      </div>
      <div class="wf">
        <label for="wOut">Weight OUT (t)</label>
        <input type="text" id="wOut" class="wnum" placeholder="0.00" inputmode="decimal" pattern="[0-9.]*">
        <div class="wunit">tonnes</div>
      </div>
    </div>
    <div class="mbtns">
      <button type="button" id="btnCancel" class="btn btn-gray">Cancel</button>
      <button type="button" id="btnSave" class="btn btn-green">Save</button>
    </div>
    <p class="mnote" id="mNote"></p>
  </div></div>
</div>

var COLORS={"Day Route":"#1d4ed8","Night Route":"#6d28d9","6th Route":"#065f46","DTL Route":"#b45309","Mandai Route":"#be123c","Tekong Route":"#0e7490"};
var sess=null,filt="all",srch="",eidx=null,selName="",selColor="#1d4ed8";

function g(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function showScreen(id){
  var all=document.querySelectorAll(".scr");
  for(var i=0;i<all.length;i++) all[i].style.display="none";
  g(id).style.display="block";
  window.scrollTo(0,0);
}

/* Wire up route buttons after DOM loads */
window.addEventListener("load",function(){
  var btns=document.querySelectorAll(".rbtn");
  for(var i=0;i<btns.length;i++){
    (function(btn){
      btn.addEventListener("click",function(){
        var name=btn.getAttribute("data-route");
        var color=btn.getAttribute("data-color");
        selName=name;
        selColor=color;
        /* reset all buttons */
        for(var j=0;j<btns.length;j++){
          btns[j].style.background="#fff";
          btns[j].style.color="#334155";
          btns[j].style.borderColor="#e2e8f0";
        }
        /* highlight selected */
        btn.style.background=color;
        btn.style.color="#fff";
        btn.style.borderColor=color;
        g("hdr").style.background=color;
      },false);
    })(btns[i]);
  }

  /* Start Recording button */
  g("btnStart").addEventListener("click",startSession,false);
  /* Save weight button */
  g("btnSave").addEventListener("click",saveW,false);
  /* Cancel modal button */
  g("btnCancel").addEventListener("click",closeModal,false);
  /* Export button */
  g("fabBtn").addEventListener("click",goExport,false);
  /* Back button */
  g("btnBack").addEventListener("click",goBack,false);
  /* End session button */
  g("btnEnd").addEventListener("click",endSess,false);
  /* Copy button */
  g("btnCopy").addEventListener("click",doCopy,false);
  /* Tab buttons */
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){
    (function(tab){
      tab.addEventListener("click",function(){
        filt=tab.getAttribute("data-f");
        for(var j=0;j<tabs.length;j++) tabs[j].classList.remove("on");
        tab.classList.add("on");
        render();
      },false);
    })(tabs[i]);
  }
  /* Search */
  g("iSrch").addEventListener("input",function(){srch=this.value;render();},false);
  /* Show first screen */
  showScreen("sSetup");
});

function startSession(){
  if(!selName){alert("Please tap a route button first");return;}
  var driver=g("iDriver").value.trim();
  var veh=g("iVeh").value;
  if(!driver){alert("Please enter your name");return;}
  if(!veh){alert("Please select a vehicle");return;}
  var src=RD[selName];
  var stops=[];
  for(var i=0;i<src.length;i++){
    var s=src[i];
    stops.push({no:s.no,customer:s.customer,address:s.address||"",bins:s.bins||"",bin_type:s.bin_type||"",wIn:"",wOut:"",time:""});
  }
  var now=new Date();
  sess={route:selName,driver:driver,veh:veh,
    date:now.toLocaleDateString("en-SG"),
    start:now.toLocaleTimeString("en-SG",{hour:"2-digit",minute:"2-digit"}),
    stops:stops};
  g("hdr").style.background=selColor;
  g("h1").textContent=selName;
  g("h2").textContent=driver+" | "+veh;
  g("rName").textContent=selName;
  g("rInfo").textContent=driver+" | "+veh+" | "+sess.date;
  g("fabBtn").style.background=selColor;
  filt="all";srch="";g("iSrch").value="";
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle("on",i===0);
  showScreen("sRoute");
  render();
}

function render(){
  var done=0;
  for(var i=0;i<sess.stops.length;i++){
    if(sess.stops[i].wIn!==""&&sess.stops[i].wOut!=="") done++;
  }
  var pend=sess.stops.length-done;
  g("rProg").textContent=done+"/"+sess.stops.length;
  g("pbN").textContent=pend;
  var list=[];
  for(var i=0;i<sess.stops.length;i++){
    var s=sess.stops[i];
    if(filt==="done"&&!(s.wIn!==""&&s.wOut!=="")) continue;
    if(filt==="pend"&&(s.wIn!==""&&s.wOut!=="")) continue;
    if(srch){
      var q=srch.toLowerCase();
      if(s.customer.toLowerCase().indexOf(q)<0&&s.address.toLowerCase().indexOf(q)<0) continue;
    }
    list.push(i);
  }
  var el=g("stopList");
  if(!list.length){
    el.innerHTML="<div class=\"empty\"><p>"+(filt==="pend"&&!pend?"All stops done!":srch?"No matches":"Nothing here.")+"</p></div>";
    return;
  }
  var html="";
  for(var i=0;i<list.length;i++){
    var idx=list[i];
    var s=sess.stops[idx];
    var both=(s.wIn!==""&&s.wOut!=="");
    var one=(s.wIn!==""||s.wOut!=="")&&!both;
    var bins=(s.bins&&s.bin_type)?(s.bins+"x"+s.bin_type):(s.bin_type||"");
    var numTxt=both?"OK":String(s.no);
    var adr=s.address.length>75?s.address.slice(0,75)+"...":s.address;
    var addrH=s.address?"<div class=\"saddr\">"+esc(adr)+"</div>":"";
    var binH=bins?"<div class=\"sbins\">"+esc(bins)+"</div>":"";
    var iH="<span class=\"wb "+(s.wIn?"wb-in":"wb-nil")+"\">IN:"+(s.wIn?s.wIn+"t":"--")+"</span>";
    var oH="<span class=\"wb "+(s.wOut?"wb-out":"wb-nil")+"\">OUT:"+(s.wOut?s.wOut+"t":"--")+"</span>";
    var tH=s.time?"<span class=\"wb wb-t\">"+s.time+"</span>":"";
    var cc="scard"+(both?" done":one?" part":"");
    var nc="snum"+(both?" done":"");
    html+="<div class=\""+cc+"\" data-idx=\""+idx+"\">"
         +"<div class=\"sr1\"><div class=\""+nc+"\">"+numTxt+"</div>"
         +"<div class=\"smain\"><div class=\"sname\">"+esc(s.customer)+"</div>"+addrH+binH+"</div></div>"
         +"<div class=\"swts\">"+iH+oH+tH+"</div></div>";
  }
  el.innerHTML=html;
  /* Wire stop card clicks */
  var cards=el.querySelectorAll(".scard");
  for(var i=0;i<cards.length;i++){
    (function(card){
      card.addEventListener("click",function(){
        openM(parseInt(card.getAttribute("data-idx"),10));
      },false);
    })(cards[i]);
  }
}

function openM(idx){
  eidx=idx;
  var s=sess.stops[idx];
  var bins=(s.bins&&s.bin_type)?(s.bins+" x "+s.bin_type):(s.bin_type||"-");
  g("mTitle").textContent="#"+s.no+" "+s.customer;
  g("mAddr").textContent=s.address||"";
  g("mBins").textContent="Bins: "+bins;
  g("wIn").value=s.wIn;
  g("wOut").value=s.wOut;
  g("mNote").textContent=s.time?"Last saved: "+s.time:"";
  g("wOv").style.display="block";
  document.body.style.overflow="hidden";
}

function closeModal(){
  g("wOv").style.display="none";
  document.body.style.overflow="";
  eidx=null;
}

function saveW(){
  if(eidx===null) return;
  sess.stops[eidx].wIn=g("wIn").value.trim();
  sess.stops[eidx].wOut=g("wOut").value.trim();
  sess.stops[eidx].time=new Date().toLocaleTimeString("en-SG",{hour:"2-digit",minute:"2-digit"});
  closeModal();
  render();
}

function goExport(){
  showScreen("sExport");
  var done=[],tIn=0,tOut=0;
  for(var i=0;i<sess.stops.length;i++){
    var s=sess.stops[i];
    if(s.wIn!==""&&s.wOut!==""){done.push(s);tIn+=parseFloat(s.wIn||0);tOut+=parseFloat(s.wOut||0);}
  }
  var net=tIn-tOut,pend=sess.stops.length-done.length;
  g("eSumm").innerHTML="<h3>Summary</h3>"
    +er("Route",sess.route)+er("Driver",sess.driver)+er("Vehicle",sess.veh)
    +er("Date",sess.date+" | "+sess.start)
    +er("Done","<span class=\"ev eg\">"+done.length+"/"+sess.stops.length+"</span>")
    +er("Pending","<span class=\"ev "+(pend?"er":"eg")+"\">"+pend+"</span>")
    +er("Total IN","<span class=\"ev\">"+tIn.toFixed(2)+" t</span>")
    +er("Total OUT","<span class=\"ev\">"+tOut.toFixed(2)+" t</span>")
    +er("Net","<span class=\"ev "+(net>=0?"eg":"er")+"\">"+net.toFixed(2)+" t</span>");
  var txt="REL WEIGHT RECORD\n==================\n"
    +"Route:"+sess.route+"\nDriver:"+sess.driver+"\nVehicle:"+sess.veh
    +"\nDate:"+sess.date+" Start:"+sess.start
    +"\n==================\nNo\tCustomer\tBins\tIN(t)\tOUT(t)\tTime\n";
  for(var i=0;i<sess.stops.length;i++){
    var s=sess.stops[i];
    var b=(s.bins&&s.bin_type)?(s.bins+"x"+s.bin_type):(s.bin_type||"-");
    txt+=s.no+"\t"+s.customer+"\t"+b+"\t"+(s.wIn||"-")+"\t"+(s.wOut||"-")+"\t"+(s.time||"")+"\n";
  }
  txt+="==================\nDone:"+done.length+"/"+sess.stops.length+" IN:"+tIn.toFixed(2)+"t OUT:"+tOut.toFixed(2)+"t Net:"+net.toFixed(2)+"t";
  g("eTxt").value=txt;
}
function er(l,v){
  return "<div class=\"erow\"><span>"+l+"</span>"+(v.indexOf("ev")>=0?v:"<span class=\"ev\">"+v+"</span>")+"</div>";
}
function doCopy(){
  var ta=g("eTxt");ta.select();
  try{document.execCommand("copy");alert("Copied!");}catch(x){alert("Long-press to copy.");}
}
function goBack(){showScreen("sRoute");render();}
function endSess(){
  if(!confirm("End session?")) return;
  sess=null;selName="";selColor="#1d4ed8";
  g("hdr").style.background="#1e40af";
  g("h1").textContent="REL Weight Recorder";
  g("h2").textContent="Select a route to start";
  var btns=document.querySelectorAll(".rbtn");
  for(var i=0;i<btns.length;i++){btns[i].style.background="#fff";btns[i].style.color="#334155";btns[i].style.borderColor="#e2e8f0";}
  g("iDriver").value="";g("iVeh").value="";
  showScreen("sSetup");
}
</script>
